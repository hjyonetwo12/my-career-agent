# core_direction(25): 职业方向与长期技术复利
# required_skills(25): 本科/实习入行可行性与核心技能匹配
# project_evidence(20): 现有课程/项目证据与可迁移性
# engineering_stack(15): 工具链、调试测试与底层工程素养
# basic_criteria(15): 学历/实习资格友好度与 WLB 风险评估
score_component_limits:
