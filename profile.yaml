# ==============================================================================
# 个人画像与开放式职业探索统一配置文件 (profile.yaml)
# ------------------------------------------------------------------------------
# 【维护原则】
#   1. 本配置用于描述当前个人情况、求职约束、兴趣与学习目标，不代表已确定职业方向。
#   2. 职业方向仅用于推荐排序、对比与综合建议，不得作为封闭的岗位采集白名单。
#   3. 岗位发现应优先依据真实招聘信息、技能要求、项目经验和可迁移能力，
#      同时保留新职业类别、未分类岗位及与当前技能相邻的岗位。
#   4. 个人兴趣只影响探索优先级，不应直接决定职业选择；尚未实践验证的方向
#      不得描述为已确定的就业主线。
#   5. 严格区分已验证能力、正在学习的内容、AI 协助完成的工作和未来学习目标。
#   6. 不得因为用户正在学习 C++ 或做过图形项目，就推断其职业兴趣已限定为
#      底层系统、图形学、游戏引擎等方向。
#   7. 日常个人画像修改原则上只修改本文件；API Key、飞书 Webhook 等密钥
#      应放在环境变量或 GitHub Secrets 中，绝不写入本文件。
# ==============================================================================

# ── 一、基本教育信息与当前求职阶段 ──
degree: 本科
job_type: 实习
target_cohort: 2029

education:
  school: 东北大学
  major: 软件工程
  degree: 本科
  graduation_year: 2029
  current_stage: 大二本科在读
  postgraduate_plan: 本科毕业后直接就业，不计划读研

# ── 二、开放式探索方向 ──
# 重要：以下是用于组织岗位和开展对比的探索维度，不是已确定的职业主线。
# 不要求必须从这些方向中选择；系统应允许依据实际招聘数据发现新的方向。
# 方向之间不预设固定优先级，排序应结合岗位需求、个人能力证据、就业可行性、
# 可迁移性、成长空间和 WLB 证据动态调整。
directions:
  - 通用软件工程与业务系统开发（后端、客户端、平台及其他软件研发岗位）
  - 工程质量与研发效率（测试开发、自动化测试、开发工具及相关岗位）
  - 数据与信息系统（数据工程、数据库应用、数据平台及相关岗位）
  - 系统、基础设施与工程平台（Linux、网络、云基础设施及相关岗位）
  - AI 应用与智能体工程（应用开发、工程集成、评测及相关岗位）
  - 行业软件与专业工程工具（制造、工业软件、医疗、能源、交通等领域）
  - 其他由实际招聘需求、技能组合或项目实践发现的潜在方向

# ── 三、一般兴趣与支线观察 ──
# 兴趣不等于职业承诺。支线可以继续学习或实践，也可以在未来转为重点探索。
optional_interest_branches:
  - 图形学与实时渲染（OpenGL、GLSL、三维图形；当前保留为技术兴趣，不默认作为主要就业方向）
  - 其他暂未形成稳定偏好的计算机技术、数学、物理及工程领域

# ── 四、技术栈及掌握程度 ──
# skills 用于概括接触过的技术，不代表每一项都达到独立完成工业项目的水平。
# 详细能力边界以 skill_proficiency 和 project_evidence 为准。
skills:
  - C++ 基础与持续学习
  - 数据结构与算法基础学习
  - Python 基础接触与 AI 辅助脚本实践
  - 操作系统与计算机系统基础学习
  - CMake 构建工具基础接触
  - Git 版本控制基础操作
  - Linux 与命令行基础接触
  - SQLite 与基础数据持久化实践接触
  - OpenGL / GLSL 基础图形实践

skill_proficiency:
  main_languages:
    - name: C++
      level: 基础学习阶段
      evidence: 正在学习 C++ 语言、面向对象、STL 等内容，并通过小型项目练习编码与调试
      limitation: 不应默认已具备独立设计、实现、测试和维护中大型工程的能力
    - name: Python
      level: 初步接触与实践
      evidence: 在 AI 辅助下参与招聘信息处理工作流的使用、修改或排查
      limitation: 不应默认已熟练掌握 Python 工程开发、Web 后端架构或自动化测试体系
  engineering_basics:
    - name: Git
      level: 基础操作阶段
      evidence: 接触过通过终端执行 Git 命令进行仓库同步等操作
      limitation: 不应默认已熟练掌握复杂分支协作、冲突处理、代码审查和团队开发流程
    - name: CMake
      level: 基础接触阶段
      evidence: 接触过 CMake 项目构建与配置
      limitation: 不应默认已掌握大型项目构建系统设计、复杂依赖管理或跨平台构建排错
    - name: Linux / 命令行
      level: 基础学习阶段
      evidence: 正在接触常见命令行和开发环境操作
      limitation: 不应默认已掌握 Linux 系统编程、服务器运维或生产环境排障
    - name: SQLite / 数据持久化
      level: 项目接触阶段
      evidence: 接触过使用 SQLite 数据库的招聘信息工作流
      limitation: 应区分使用现成程序、借助 AI 修改代码与独立设计数据库方案的能力
  interest_explorations:
    - name: OpenGL / GLSL
      level: 入门实践阶段
      evidence: 完成过小型图形渲染学习项目
      limitation: 不能据此推断已掌握高级渲染技术或确定图形学职业方向

# ── 五、真实项目与学习证据 ──
# 仅记录真实发生的经历。AI 参与完成的代码不自动等于个人已掌握相应技术。
project_evidence:
  - 正在持续学习 C++、数据结构与算法、操作系统及计算机系统基础；当前能力应结合实际代码、练习和独立完成任务的情况逐步验证
  - 曾进行 C++、OpenGL、GLSL 小型图形渲染项目实践，接触了基础渲染流程、着色器及相关调试；该项目用于提供基础编码与调试证据，不代表选择图形学就业
  - 正在使用 AI 辅助改造和运行基于 Python、SQLite、GitHub Actions 等技术的招聘情报分析工作流，接触岗位采集、数据持久化、自动化运行和报告查看等工程问题；应根据本人实际负责的修改、理解、调试与验证工作评价能力，不得直接视为已独立设计并实现完整商业级系统
  - 接触过 Git、CMake、开发环境配置和常见问题排查；具体熟练度应以实际独立操作和问题解决证据为准

# ── 六、分阶段学习目标 ──
# 以下均为学习目标，不得直接作为已掌握技能用于岗位匹配加分。
# 应优先从真实岗位要求中发现高频、可迁移且适合当前阶段的学习内容。
learning_targets:
  - 持续学习现代 C++、代码阅读、调试、单元测试与工程化实践
  - 提升数据结构与算法能力，并理解常见数据结构和算法的实际使用场景
  - 学习操作系统、计算机体系结构、Linux、进程线程、并发与网络基础
  - 学习 Git 协作、构建工具、测试、日志、调试和工程问题定位
  - 根据岗位需求逐步学习数据库、SQL、事务、索引与缓存等技术
  - 根据实际项目需要探索 Python 自动化、后端服务或工程工具开发
  - 学习如何使用 AI 编程工具，同时提升代码审查、测试、调试和独立解释代码的能力
  - 通过小型、可验证的项目实践，逐步比较不同岗位的工作内容与个人适配度
  - 根据实际岗位需求与兴趣变化动态增加或调整学习目标，不限定技术栈

unverified_skills: []

# ── 七、长期职业目标与 WLB / 成长 / 稳定性偏好 ──
long_term_goals:
  primary_goal: 本科毕业后直接就业，寻找能够长期积累技术能力、具有合理工作生活平衡的工作
  career_path_preference: 优先积累可迁移的软件工程能力；具体职业方向由真实岗位要求、实践反馈和个人偏好逐步确定
  internship_goal: 在本科阶段争取有质量的实习，通过真实工程任务验证能力、了解团队工作方式并探索职业适配度
  decision_principle: 不因短期热门、单个项目经历或当前学习语言而过早锁定职业方向

preferences:
  wlb_priority: high
  tech_growth_priority: high
  stability_priority: high
  overtime_tolerance: low
  prefer_bachelor_friendly: true

# ── 八、当前约束与意向城市 ──
preferred_cities:
  - 成都
  - 上海
  - 深圳
  - 杭州
  - 广州
  - 武汉
  - 苏州
  - 北京

constraints:
  reject_master_phd_only: true
  reject_high_overtime_signals: true
  salary_expectation: 符合本科实习或校招的正常市场范围；同时关注工作内容、团队工程规范、成长空间、转正机会与 WLB

# 仅用于排除明显不符合求职目标的岗位，不应用过度宽泛的关键词误杀技术岗位。
# 高强度加班、大小周、高频出差、驻场等情况优先作为风险证据评估；
# 除非属于明确的硬性约束，否则不要只凭职位名称推断工作条件。
# WLB 证据不足时标记“未知/待核实”，不得直接判定为好或坏。
excluded_title_keywords:
  - 博士
  - 硕士及以上
  - 销售
  - 客服
  - 行政
  - 人力
  - 财务
  - 法务
  - 主播
  - 买量
  - 催收

# ── 九、可调整的匹配权重与推荐分数线 ──
# 五项权重之和必须等于 100。
# 方向相关度仅用于排序，不能惩罚尚未探索过但技能相邻、可迁移性强的岗位。
score_component_limits:
  core_direction: 20
  required_skills: 25
  project_evidence: 20
  engineering_stack: 15
  basic_criteria: 20

score_thresholds:
  recommend: 75
  consider: 60

# ── 十、目标岗位关键词 ──
# 关键词仅用于辅助检索、标签分类和匹配解释，不限制岗位采集。
# 应允许同一岗位拥有多个标签；未知类别岗位也必须保留。
# 不得因关键词没有命中，就将岗位直接视为不相关或从数据库中删除。
target_roles:
  - name: 通用软件研发与业务系统
    keywords: [软件开发, 软件研发, C++开发, Python开发, Java开发, Go开发, 后端开发, 服务端开发, 客户端开发, 平台开发]
  - name: 工程质量与研发效率
    keywords: [测试开发, 测开, 自动化测试, 质量工程, 测试工具, 研发效能, CI, CD, 开发工具]
  - name: 数据与信息系统
    keywords: [数据工程, 数据平台, 数据研发, 数据治理, SQL, 数据库应用, 数据管道, 存储]
  - name: 系统与基础设施
    keywords: [Linux, 系统软件, 网络编程, 基础设施, 云平台, 分布式系统, 中间件, 容器]
  - name: AI 应用与工程集成
    keywords: [AI 应用开发, Agent, 智能体, RAG, AI 工程, 模型应用, AI 评测, 自动化工作流]
  - name: 行业软件与专业工程工具
    keywords: [工业软件, 制造软件, 医疗软件, 能源软件, 交通软件, CAD, CAE, 仿真, 桌面软件, SDK]
  - name: 兴趣探索参照：图形与三维技术
    keywords: [图形学, 渲染, OpenGL, GLSL, 三维, CAD 几何, 视景仿真]
  - name: 其他或尚未分类的岗位
    keywords: []
