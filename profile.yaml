# ==============================================================================
# 个人画像与多维职业探索统一配置文件 (profile.yaml)
# ------------------------------------------------------------------------------
# 【维护原则】
#   1. 日常修改个人求职需求（技术栈、项目经历、重点探索方向 vs 一般兴趣支线、
#      WLB/城市偏好、毕业年份与求职阶段），只需修改本文件，无需改动任何 .py 代码。
#   2. 本文件中的兴趣方向仅用于推荐排序、方向对比优先级与综合建议生成，
#      绝不会变成封闭的岗位采集白名单，系统仍会完整保留所有职业类别与技能相邻岗位。
#   3. 请勿在本文件中填写 DEEPSEEK_API_KEY 或 FEISHU_WEBHOOK 等敏感密钥（密钥请放 .env）。
# ==============================================================================

# ── 一、基本教育信息与当前求职阶段 ──
degree: 本科
job_type: 实习
target_cohort: 2029

education:
  school: 本科院校（计算机相关专业）
  major: 计算机科学与技术 / 软件工程方向
  degree: 本科
  graduation_year: 2029
  current_stage: 大二本科在读（目标本科毕业直接就业，不读研）

# ── 二、重点探索方向（directions：高优先级探索，影响推荐排序与主线建议） ──
# 提示：若想将某个方向降级为“一般兴趣”，只需将其剪切粘贴到下方 optional_interest_branches 即可。
directions:
  - 后端服务、企业级平台与分布式系统工程 (C++/Go/Python/Java)
  - 跨平台桌面客户端、办公软件与工业软件研发 (C++/Qt/SDK/Windows&Mac)
  - 测试开发 (SDET)、质量工程与研发效能工具链 (Python/C++/自动化测试/CI)
  - 关键基础设施、外企工程与高稳定行业数字化软件 (轨交/电力/医疗影像/制造IT)
  - 数据工程、数据库应用与数据中台研发 (SQL/Python/数据管道/存储)
  - 云原生基础设施、Linux系统软件与高可用运维 (Linux/Docker/K8s/网络与安全)
  - AI 应用工程与企业级智能体落地 (Agent/RAG/AI全栈工程，非算法科研岗)

# ── 三、一般兴趣与支线观察（optional_interest_branches：保留对比，不作主线强绑定） ──
optional_interest_branches:
  - 图形学与实时渲染 (OpenGL/GLSL/3D视景/工业CAD几何——作为个人兴趣与工程审美补充)

# ── 四、技术栈及掌握程度（skills 为简洁列表；skill_proficiency 为详细熟练度说明） ──
skills:
  - C++基础 (面向对象/STL/内存管理基础)
  - Python (自动化脚本/数据处理/Web后端基础)
  - 数据结构与算法基础
  - 操作系统与计算机系统基础
  - CMake与Makefile构建基础
  - Git版本控制与调试基础
  - Linux基础环境与命令行操作
  - SQLite与基础数据持久化
  - OpenGL/GLSL基础实践 (个人兴趣项目经历)

skill_proficiency:
  main_languages:
    - name: C++
      level: 熟悉基础语法、STL 容器、RAII 与面向对象设计，可独立编写中小型工程
    - name: Python
      level: 熟悉脚本开发、数据清洗、SQLite 操作与自动化测试 (pytest)
  engineering_basics:
    - name: Linux / Git / CMake
      level: 掌握日常命令行操作、Git 分支管理与 CMake 构建流程
  interest_explorations:
    - name: OpenGL / GLSL
      level: 掌握基础渲染管线、着色器编写与简单光照模型加载

# ── 五、真实项目与学习证据（严禁夸大或虚构未完成经历，供 AI 与本地评分核对证据） ──
project_evidence:
  - 正在学习 C++、数据结构与算法及计算机系统基础，具备良好的代码规范意识
  - 曾使用 C++、OpenGL、GLSL 完成小型图形渲染探索项目（用于证明C++工程编码与调试能力，不绑定图形就业）
  - 正在基于 Python、SQLite 与 Web 前端改造构建本地自动化招聘情报分析系统（具备基础全栈脚本与数据处理实践）
  - 具备基础的 CMake 构建、Git 版本管理与问题排查经验

# ── 六、分阶段计划学习目标（仅代表学习计划，评分器不会将其误当成已掌握技能） ──
learning_targets:
  - 现代 C++ 工程实践与调试/单元测试 (GDB / AddressSanitizer / GoogleTest)
  - Python 自动化工程与后端/工具快速开发 (FastAPI / PyTest / 数据处理脚本)
  - 操作系统、Linux 系统编程、多线程并发与计算机网络 (TCP/IP / HTTP / Socket / 进程线程)
  - 数据库原理与工程使用 (MySQL / PostgreSQL / SQL优化 / Redis缓存基础)
  - 跨平台客户端或服务端工程架构 (Qt / 现代C++模块化设计 / Golang或Java微服务基础)
  - AI 辅助工程与智能体应用开发 (AI Coding工具链 / Prompt与RAG工程集成 / 自动化评测)

unverified_skills: []

# ── 七、长期职业目标与 WLB / 成长 / 稳定性偏好 ──
long_term_goals:
  primary_goal: 本科毕业直接进入技术成长体系规范、工作生活平衡(WLB)健康的软件研发团队
  career_path_preference: 优先积累跨行业可迁移的通用软件工程能力（客户端/后端/系统/测开），避免过度绑定单一封闭工具
  internship_goal: 大二下至大三完成 1-2 段有质量的软件工程实习，验证工作内容与团队作息

preferences:
  wlb_priority: high             # high / medium / low：工作生活平衡优先级
  tech_growth_priority: high     # high / medium / low：技术成长与工程规范优先级
  stability_priority: high       # high / medium / low：行业与岗位长期稳定性优先级
  overtime_tolerance: low        # low / medium / high：对常态化熬夜/大小周/高频出差的容忍度
  prefer_bachelor_friendly: true # 优先筛选明确对本科学历友好的岗位

# ── 八、当前硬性约束与意向城市 ──
preferred_cities:
  - 成都
  - 上海
  - 深圳
  - 杭州
  - 广州
  - 武汉
  - 苏州
  - 北京

constraints:
  reject_master_phd_only: true
  reject_high_overtime_signals: true
  salary_expectation: 符合行业本科实习/校招正常范围，更看重团队工程规范、转正机会与WLB

excluded_title_keywords:
  - 博士
  - 硕士及以上
  - 销售
  - 客服
  - 行政
  - 人力
  - 财务
  - 法务
  - 主播
  - 买量
  - 催收
  - 驻场运维

# ── 九、可调整的匹配权重与推荐分数线（五项权重之和必须等于 100） ──
score_component_limits:
  core_direction: 20      # 职业方向可探索性与跨行业可迁移复利
  required_skills: 25     # 必需技能匹配度与基于现有C++/系统基础的学习转换成本
  project_evidence: 20    # 现有工程能力证据的可迁移支撑度
  engineering_stack: 15   # 通用工程底座价值（OS/网络/数据库/测试/构建/AI协同）
  basic_criteria: 20      # 本科生真实入行可行性（10分）+ 长期 WLB 与反爆卷安全证据（10分）

score_thresholds:
  recommend: 75
  consider: 60

# ── 十、目标岗位方向关键词（辅助预筛与匹配加权，不限制全库分类与开放式发现） ──
target_roles:
  - name: 跨平台桌面客户端、办公与工业软件工程
    keywords: [桌面开发, PC客户端, 客户端研发, 客户端开发, C++研发, C++开发, Qt, 上位机, 办公协同, SDK, Windows, 工业软件]
  - name: 关键基础设施、外企与高稳定行业软件
    keywords: [软件开发工程师, IT软件开发, 系统软件, 信号, 医疗软件, 数字化, 自动化软件, 平台软件]
  - name: 后端服务、云原生与企业级数据平台
    keywords: [后端开发, 服务端研发, 服务端开发, 软件研发, Golang, Go开发, Python开发, Java开发, 数据研发, 大数据开发, 数据治理, 云原生]
  - name: 测试开发(SDET)、质量工程与研发效能
    keywords: [测试开发, 测开, 软件测试, 云产品测试, 服务端测试, 自动化测试, 质量工程, DevOps, SRE, 工程效能]
  - name: AI应用工程与企业级智能体落地(非纯科研算法)
    keywords: [AI软件开发, AI应用开发, AI全栈, Agent开发, 智能体开发, Agent评测, AI数据工具, RAG]
  - name: 个人兴趣参照：图形学与三维工业CAD
    keywords: [图形, 渲染, 三维, CAD, 视景仿真, OpenGL]
