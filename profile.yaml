# ==============================================================================
# 个人画像与开放式职业探索统一配置文件 (profile.yaml)
# ------------------------------------------------------------------------------
# 【一、明确用户状态与反偏置准则】
#   1. 用户目前学习 C++，这是现有技能和阶段性学习经历，不代表已经确定职业方向。
#   2. 用户希望先了解中国大陆不同计算机岗位的真实招聘要求，再决定重点投入的方向。
#   3. 用户重视工作与生活平衡（WLB）、稳定成长和长期技术积累。
#   4. 严禁仅凭用户学习 C++，推断其对 C++ 职业方向具有更高兴趣。
#   5. 严禁将“学习迁移成本低”直接等同于“岗位适合度高”。
#   6. 在用户尚未确认求职主线时，默认使用“探索模式 (exploration)”，支持跨语言
#      （Java / Python / Go / JavaScript / TypeScript / C++ / Rust 等）与跨方向探索。
#   7. 日常个人画像修改原则上只修改本文件；API Key、飞书 Webhook 等密钥
#      应放在环境变量或 GitHub Secrets 中，绝不写入本文件。
# ==============================================================================

# ── 一、推荐模式与主线锁定状态 ──
# recommendation_mode 可选值：
#   - exploration : 探索模式（默认）。优先帮助用户了解不同岗位类别及其真实要求，
#                   避免被当前学习语言（C++）锁定；学习/转型成本独立评估，不自动抬高 C++ 岗位总分。
#   - targeted    : 定向求职模式。当用户明确选择目标岗位/主线方向后启用，重点筛选该方向技术栈。
recommendation_mode: exploration
target_direction_locked: false
locked_target_directions: []
locked_target_languages: []

user_state:
  current_learning_languages: [C++, Python]
  career_direction_determined: false
  exploration_goal: 先全面了解中国大陆不同计算机岗位的真实招聘要求、技术栈、能力差距与转型成本，再决定重点投入方向
  core_priorities:
    - 工作与生活平衡 (WLB)
    - 稳定成长与规范工程文化
    - 长期技术积累与跨行业可迁移性
  bias_guardrails:
    infer_cpp_direction_interest: false
    equate_low_learning_cost_with_suitability: false
    use_cpp_as_default_direction_filter: false

# ── 二、基本教育信息与当前求职阶段 ──
degree: 本科
job_type: 实习
target_cohort: 2029

education:
  school: 东北大学
  major: 软件工程
  degree: 本科
  graduation_year: 2029
  current_stage: 大二本科在读
  postgraduate_plan: 本科毕业后直接就业，不计划读研

# ── 三、开放式探索方向（跨语言、跨领域） ──
# 重要：以下是用于组织岗位和开展对比的探索维度，不是已确定的职业主线。
# 在探索模式下，允许发现并评估使用 Java、Python、Go、JavaScript/TypeScript、C++ 等
# 各种技术栈的计算机岗位，方向之间不预设固定语言偏置。
directions:
  - 通用软件工程与业务系统开发（后端、全栈、客户端、平台研发，涵盖 Java / Go / Python / TypeScript / C++ 等技术栈）
  - 工程质量与研发效率（测试开发 SDET、自动化测试、质量工程、DevOps、开发工具及相关岗位）
  - 数据与信息系统（数据工程、数据库应用、数据平台、分布式存储及相关岗位）
  - 系统、基础设施与工程平台（Linux、网络、云原生基础设施、容器、安全工程及相关岗位）
  - AI 应用与智能体工程（AI 应用开发、Agent/RAG 工程集成、评测工具及相关岗位）
  - 行业软件与专业工程工具（工业软件、制造、医疗、能源、轨交、桌面与跨平台软件等领域）
  - 其他由实际招聘需求、技能组合或项目实践发现的计算机方向（含 Web 前端、移动端等）

# ── 四、一般兴趣与支线观察 ──
# 兴趣不等于职业承诺。支线可以继续学习或实践，也可以在未来转为重点探索。
optional_interest_branches:
  - 图形学与实时渲染（OpenGL、GLSL、三维图形；当前保留为技术兴趣，不默认作为主要就业方向）
  - 其他暂未形成稳定偏好的计算机技术、数学、物理及工程领域

# ── 四-B、个人画像：用于岗位兴趣过滤，而不只是按职业名称分类 ──
# 注意：以下是基于用户目前表达形成的暂定画像，不是固定人格结论；后续可按真实体验修正。
# 兴趣标签用于判断“日常工作内容是否可能让用户愿意长期投入”，不能直接当作技能或职业承诺。
personal_profile:
  thinking_and_work_style:
    - 对拆解事物、理解系统内部机制和弄清“它为什么这样工作”有持续好奇心
    - 更容易被具体问题吸引：分析当前情况、寻找解决方案、动手验证并观察结果
    - 喜欢有反馈的实践和工程问题；希望理论能逐步连接到真实系统、项目或可解释的现象
    - 重视长期学习和技术积累，但不希望为了学习而无限堆砌理论、框架或热门名词
    - 倾向直接实践，再根据遇到的问题补充知识；希望计划务实，不喜欢脱离现实的学习时间表
  hobbies_and_general_interests:
    - 游戏：接触动作、冒险、剧情、角色扮演、开放世界、生存建造、竞速、回合制及部分竞技类游戏
    - 游戏偏好：喜欢分析具体局势、找到解法并及时验证；如果玩法在熟悉后长期重复、后续决策相似且缺乏新鲜感，兴趣容易下降
    - 动漫与剧情作品：有持续接触，偏好不局限于单一类型
    - 技术与科学好奇：对计算机系统、软件如何工作以及技术背后的机制感兴趣；也对数学、物理、化学等领域保留一般性求知兴趣
    - 视觉创作：曾探索数字绘画、素描和动漫临摹，可视为尚待验证的兴趣，不应默认是职业目标
    - 哲学与人生问题：会主动思考人生选择、价值和世界如何运作；属于个人兴趣，不代表希望从事哲学相关职业
  possible_work_content_preferences:
    - 分析真实问题并找到可验证的解决办法
    - 理解和构建软件系统、开发工具或有明确用途的技术产品
    - 有一定技术深度、可以持续积累经验，而非长期只做机械重复操作
    - 能通过测试、运行结果、数据或用户反馈检验工作成果
    - 在合理工作节奏下保有持续学习和生活空间
  interest_caveats:
    - 兴趣广泛且职业方向尚未确定；不得将任何单一爱好直接映射为职业主线
    - 喜欢游戏不等于一定喜欢游戏开发；喜欢图形项目不等于一定喜欢图形学岗位
    - 对 AI 工具和 Agent 感到好奇，不等于已经确认 AI 应用开发或 Agent 开发为职业兴趣
    - 对技术原理好奇，不等于必然喜欢底层开发、算法研究或高强度科研岗位

# ── 四-C、岗位兴趣过滤策略 ──
# 目标是先过滤明显不适合的工作内容，减少低价值信息量，而不是仅按职位名称列出岗位。
interest_filtering:
  enabled: true
  evaluate_actual_work_content: true  # 优先阅读岗位职责、日常任务和团队产出，不能只凭标题/技术关键词判断
  use_hobbies_as_soft_evidence_only: true
  separate_interest_fit_from_skill_fit: true
  separate_interest_fit_from_learning_cost: true
  screening_rules:
    - 判断岗位日常工作是否包含问题分析、系统理解、方案实现、调试验证或持续技术改进
    - 对长期以机械重复、简单信息录入、纯流程跟单、纯销售/客服或缺乏技术成长为主的岗位降低兴趣匹配度；若实际职责不同，应以证据为准
    - 不因岗位属于 AI、Agent、C++、图形学等热门或当前接触过的方向而自动加分
    - 不因用户暂时缺少某项技能，就将潜在兴趣高但可合理学习的岗位直接判为无兴趣；技能差距单独呈现
    - 对岗位职责描述不足、无法判断日常工作内容的职位标记“兴趣证据不足”，不要伪装成高匹配
  result_policy:
    - 优先展示兴趣匹配较高、硬性条件可满足且岗位信息可信的岗位
    - 明显低兴趣匹配的岗位默认不进入主推荐列表；必要时只在简短的“已过滤类别”统计中说明原因
    - 对中等或不确定匹配的岗位，只保留少量有代表性的探索样本，避免重新堆出大量岗位
    - 每个推荐岗位应简要说明“哪些具体工作内容可能适合用户”，并引用招聘描述中的依据
    - 兴趣判断置信度低时明确标注不确定性，不把推测写成用户已经表达过的偏好
    - 兴趣匹配不能覆盖学历、实习时间、技术要求、城市、WLB 和招聘真实性等硬条件
  profile_update_policy:
    - 用户亲自表达的明确喜欢/不喜欢优先于模型推断
    - 用户体验某类岗位或项目后，可以记录“喜欢的工作内容”“不喜欢的工作内容”和“尚待验证的内容”
    - 不根据一次短期体验就永久排除整个职业大类

# ── 五、技术栈及掌握程度 ──
# skills 用于概括接触过的技术，不代表每一项都达到独立完成工业项目的水平。
# 详细能力边界以 skill_proficiency 和 project_evidence 为准。
skills:
  - C++ 基础与持续学习
  - 数据结构与算法基础学习
  - Python 基础接触与 AI 辅助脚本实践
  - 操作系统与计算机系统基础学习
  - CMake 构建工具基础接触
  - Git 版本控制基础操作
  - Linux 与命令行基础接触
  - SQLite 与基础数据持久化实践接触
  - OpenGL / GLSL 基础图形实践

skill_proficiency:
  main_languages:
    - name: C++
      level: 基础学习阶段
      evidence: 正在学习 C++ 语言、面向对象、STL 等内容，并通过小型项目练习编码与调试
      limitation: 属于现有学习经历而非锁定的就业方向；不应默认已具备独立设计、实现和维护中大型 C++ 工程的能力，也不能直接替代 Java/Go/JS/TS 等生态框架经验
    - name: Python
      level: 初步接触与实践
      evidence: 使用 AI 进行招聘信息处理工作流的使用、修改或排查
      limitation: 不应默认已熟练掌握 Python 工程开发、Web 后端架构或自动化测试体系。本人还没开始学习
  engineering_basics:
    - name: Git
      level: 基础操作阶段
      evidence: 接触过通过终端执行 Git 命令进行仓库同步等操作
      limitation: 不应默认已熟练掌握复杂分支协作、冲突处理、代码审查和团队开发流程
    - name: CMake
      level: 基础接触阶段
      evidence: 接触过 CMake 项目构建与配置
      limitation: 不应默认已掌握大型项目构建系统设计、复杂依赖管理或跨平台构建排错
    - name: Linux / 命令行
      level: 基础学习阶段
      evidence: 正在接触常见命令行和开发环境操作
      limitation: 不应默认已掌握 Linux 系统编程、服务器运维或生产环境排障
    - name: SQLite / 数据持久化
      level: 项目接触阶段
      evidence: 接触过使用 SQLite 数据库的招聘信息工作流
      limitation: 应区分使用现成程序、借助 AI 修改代码与独立设计数据库方案的能力
  interest_explorations:
    - name: OpenGL / GLSL
      level: 入门实践阶段
      evidence: 完成过小型图形渲染学习项目
      limitation: 不能据此推断已掌握高级渲染技术或确定图形学职业方向

# ── 六、真实项目与学习证据 ──
# 仅记录真实发生的经历。AI 参与完成的代码不自动等于个人已掌握相应技术。
project_evidence:
  - 正在持续学习 C++、数据结构与算法、操作系统及计算机系统基础；当前能力应结合实际代码、练习和独立完成任务的情况逐步验证
  - 曾进行 C++、OpenGL、GLSL 小型图形渲染项目实践，接触了基础渲染流程、着色器及相关调试；该项目用于提供基础编码与调试证据，不代表选择图形学或 C++ 专属岗位就业
  - 正在使用 AI 辅助改造和运行基于 Python、SQLite、GitHub Actions 等技术的招聘情报分析工作流，接触岗位采集、数据持久化、自动化运行和报告查看等工程问题；应根据本人实际负责的修改、理解、调试与验证工作评价能力，不得直接视为已独立设计并实现完整商业级系统
  - 接触过 Git、CMake、开发环境配置和常见问题排查；具体熟练度应以实际独立操作和问题解决证据为准

# ── 七、分阶段学习目标 ──
# 以下均为学习目标，不得直接作为已掌握技能用于岗位匹配加分。
# 应优先从真实岗位要求中发现高频、可迁移且适合当前阶段的学习内容。
learning_targets:
  - 提升数据结构与算法、操作系统、计算机网络、Linux 等跨语言通用计算机工程底座
  - 学习数据库、SQL、事务、索引与缓存（MySQL / PostgreSQL / Redis）等全行业通用技术
  - 学习 Git 协作、单元测试、接口测试、日志、调试和工程问题定位
  - 根据真实招聘数据对比探索 Go、Java、Python、TypeScript/JavaScript 或 C++ 在不同岗位方向中的实际要求与转型成本
  - 学习如何使用 AI 编程工具，同时提升代码审查、测试、调试和独立解释代码的能力
  - 通过小型、可验证的项目实践，逐步比较不同岗位的工作内容与个人适配度

unverified_skills: []

# ── 八、长期职业目标与 WLB / 成长 / 稳定性偏好 ──
long_term_goals:
  primary_goal: 本科毕业后直接就业，寻找能够长期积累技术能力、具有合理工作生活平衡的工作
  career_path_preference: 优先积累可迁移的软件工程能力；具体职业方向由真实岗位要求、实践反馈和个人偏好逐步确定
  internship_goal: 在本科阶段争取有质量的实习，通过真实工程任务验证能力、了解团队工作方式并探索职业适配度
  decision_principle: 不因短期热门、单个项目经历或当前学习语言（C++）而过早锁定职业方向

preferences:
  wlb_priority: high
  tech_growth_priority: high
  stability_priority: high
  overtime_tolerance: low
  prefer_bachelor_friendly: true

# ── 九、当前约束与意向城市 ──
preferred_cities:
  - 成都
  - 上海
  - 深圳
  - 杭州
  - 广州
  - 武汉
  - 苏州
  - 北京
  - 南京

constraints:
  reject_master_phd_only: true
  reject_high_overtime_signals: true
  salary_expectation: 符合本科实习或校招的正常市场范围；同时关注工作内容、团队工程规范、成长空间、转正机会与 WLB

excluded_title_keywords:
  - 博士
  - 硕士及以上
  - 销售
  - 客服
  - 行政
  - 人力
  - 财务
  - 法务
  - 主播
  - 买量
  - 催收

# ── 十、可调整的匹配权重与推荐分数线 ──
# 五项子分权重之和必须等于 100（内部映射并拆解为 7 维独立评估因素）。
# 在探索模式下，C++ 不享受额外方向偏置加分，学习转型成本独立评估。
score_component_limits:
  core_direction: 20
  required_skills: 25
  project_evidence: 20
  engineering_stack: 15
  basic_criteria: 20

score_thresholds:
  recommend: 75
  consider: 60

# ── 十一、目标岗位关键词（跨语言辅助检索，不限制岗位采集） ──
target_roles:
  - name: 通用软件研发与业务系统
    keywords: [软件开发, 软件研发, 后端开发, 服务端开发, Java开发, Go开发, Golang, Python开发, C++开发, 全栈开发, 前端开发, TypeScript, 客户端开发, 平台开发]
  - name: 工程质量与研发效率
    keywords: [测试开发, 测开, SDET, 自动化测试, 质量工程, 测试工具, 研发效能, CI, CD, DevOps, 开发工具]
  - name: 数据与信息系统
    keywords: [数据工程, 数据平台, 数据研发, 数据开发, 数据治理, SQL, 数据库应用, 数据管道, 存储]
  - name: 系统与基础设施
    keywords: [Linux, 系统软件, 网络编程, 基础设施, 云平台, 云原生, 分布式系统, 中间件, 容器, 安全工程]
  - name: AI 应用与工程集成
    keywords: [AI 应用开发, Agent, 智能体, RAG, AI 工程, 模型应用, AI 评测, 自动化工作流]
  - name: 行业软件与专业工程工具
    keywords: [工业软件, 制造软件, 医疗软件, 能源软件, 交通软件, CAD, CAE, 仿真, 桌面软件, SDK]
  - name: 兴趣探索参照：图形与三维技术
    keywords: [图形学, 渲染, OpenGL, GLSL, 三维, CAD 几何, 视景仿真]
  - name: 其他或尚未分类的岗位
    keywords: []

# ── 十二、新增模块配置：高频技能栈实现项目推荐 & 社区口碑辅助 WLB 审核 ──
skill_project_module:
  enabled: true
  min_category_samples: 15
  min_overall_samples: 30
  cache_enabled: true
  use_ai_for_project_insights: false

wlb_community_module:
  enabled: true
  cache_ttl_days: 14
  max_companies_per_run: 20
  allow_live_public_search: false
  use_ai_for_wlb_synthesis: false
