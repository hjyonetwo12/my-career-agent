name: Sync report (applications)

# 本地录入投递（data/applications.json）或修改个人画像（profile.yaml）push 后，
# 只重新生成报告与综合建议并部署，不爬取、不调岗位评分 API（零 token）。
on:
  push:
    branches: [main]
    paths:
      - "profile.yaml"
      - "profile_config.py"
      - "data/applications.json"
      - "data/jobs.db"
      - "reporter.py"
      - "view_all.py"
      - "job_filters.py"
      - "db.py"
      - ".github/workflows/sync_report.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-report
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Regenerate report and advice (no crawl / no DeepSeek)
        env:
          CI: "true"
        run: python view_all.py
      - name: Upload updated report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-agent-report
          retention-days: 30
          if-no-files-found: ignore
          path: |
            reports/index.html
            data/advice_state.json
      - name: Deploy report to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          publish_branch: gh-pages
          keep_files: true
