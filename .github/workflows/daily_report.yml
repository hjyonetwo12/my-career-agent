name: Daily Recruitment Report

on:
  schedule:
    # 提前 2 小时触发，补偿 GitHub 调度延迟（实测推送常拖到北京 10 点多）。
    # UTC 22:00 = 北京次日 06:00；延迟约 2h 后推送落在 08:00 附近。
    - cron: "0 22 * * 1,3,5"
  workflow_dispatch:
    inputs:
      skip_crawl:
        description: "是否跳过爬虫抓取（仅基于已有数据库重算评分与综合建议）"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      force_advice_refresh:
        description: "是否强制重新生成综合建议新版本"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      max_pro_jobs:
        description: "本次最多调用 DeepSeek Pro 评分的岗位数（留空则按 config.yaml 默认值）"
        required: false
        default: ""
        type: string

permissions:
  contents: write   # 允许 push DB 回主分支 + push gh-pages
  pages: write      # 允许自动激活或查询 GitHub Pages 状态

concurrency:
  # jobs.db 是二进制状态文件，多个抓取任务并发回写时无法自动合并。
  # 排队而不是取消正在运行的任务，避免丢失一次完整抓取结果。
  group: daily-recruitment-report
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # CI runner 是 UTC：强制使用 Asia/Shanghai 中国标准时间
      TZ: Asia/Shanghai
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run pipeline (generate DB and HTML report before notify)
        id: run_pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
          PUBLIC_REPORT_MODE: ${{ vars.PUBLIC_REPORT_MODE || '1' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SKIP_CRAWL: ${{ inputs.skip_crawl }}
          FORCE_ADVICE_REFRESH: ${{ inputs.force_advice_refresh }}
          MAX_PRO_JOBS_OVERRIDE: ${{ inputs.max_pro_jobs }}
          SKIP_NOTIFY: "1"
          CI: "true"
        run: python main.py

      - name: Verify generated report integrity
        run: |
          test -s reports/index.html
          test -s reports/report_meta.json
          touch reports/.nojekyll

      - name: Upload report and run summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-agent-report
          retention-days: 30
          if-no-files-found: ignore
          path: |
            reports/index.html
            reports/report_meta.json
            reports/*.html
            outputs/latest_run_summary.json
            outputs/run.log
            data/advice_state.json
            data/skill_projects_state.json
            data/wlb_community_state.json

      - name: Commit DB and state back to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.db config.yaml outputs/company_integration_status.md
          if [ -f data/advice_state.json ]; then git add data/advice_state.json; fi
          if [ -f data/skill_projects_state.json ]; then git add data/skill_projects_state.json; fi
          if [ -f data/wlb_community_state.json ]; then git add data/wlb_community_state.json; fi
          if [ -f outputs/latest_run_summary.json ]; then git add outputs/latest_run_summary.json; fi
          if git diff --staged --quiet; then
            echo "No DB or state changes to commit"
          else
            git commit -m "chore: update crawler state $(date +%Y-%m-%d) [skip ci]"
            if ! git pull --rebase --autostash origin main; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ "$conflicts" = "data/jobs.db" ]; then
                git checkout --theirs data/jobs.db
                git add data/jobs.db
                GIT_EDITOR=true git rebase --continue
              else
                echo "Unexpected rebase conflict: $conflicts" >&2
                exit 1
              fi
            fi
            git push
          fi

      - name: Deploy report to gh-pages
        id: deploy_pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          publish_branch: gh-pages
          keep_files: false

      - name: Ensure GitHub Pages enabled and resolve deployed URL
        id: pages_info
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          DEPLOYED_URL=""
          if command -v gh >/dev/null 2>&1 && [ -n "$GITHUB_REPOSITORY" ]; then
            if ! gh api "repos/${GITHUB_REPOSITORY}/pages" >/tmp/pages_info.json 2>/dev/null; then
              echo "GitHub Pages not yet enabled; attempting automatic activation on gh-pages branch..."
              gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" \
                -f "source[branch]=gh-pages" \
                -f "source[path]=/" >/tmp/pages_info.json 2>/dev/null || true
            fi
            if [ -s /tmp/pages_info.json ]; then
              DEPLOYED_URL="$(python3 -c 'import json,sys; d=json.load(open("/tmp/pages_info.json")); print((d.get("html_url") or "").strip())' 2>/dev/null || true)"
            fi
          fi
          echo "deployed_url=${DEPLOYED_URL}" >> "$GITHUB_OUTPUT"

      - name: Send Feishu notification after deployment verification
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
          DEPLOYED_REPORT_URL: ${{ steps.pages_info.outputs.deployed_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEDUP_FEISHU_PUSH: "1"
        run: |
          python notifier.py \
            --deploy-status "${{ steps.deploy_pages.outcome }}" \
            --pipeline-status "${{ steps.run_pipeline.outcome }}" \
            --deployed-url "${{ steps.pages_info.outputs.deployed_url }}" \
            --verify-url
